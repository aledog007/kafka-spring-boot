spring.application.name=kafka-consumer2

spring.kafka.bootstrap-servers=localhost:9092
# Fuer Teil 4 umstellen: myGroup (gleiche Gruppe) oder z. B. otherGroup (eigene Gruppe).
# Ohne Neu-Builden: java -jar target/kafka-consumer2-0.0.1-SNAPSHOT.jar --spring.kafka.consumer.group-id=otherGroup
spring.kafka.consumer.group-id=myGroup
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Der Producer schreibt ch.kafka.demo.model.CustomMessage in den Type-Header.
# Diese Klasse existiert hier nicht, darum Header ignorieren und die eigene Klasse verwenden.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=ch.kafka.consumer2.CustomMessage
