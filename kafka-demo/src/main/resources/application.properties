spring.application.name=kafka-demo

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=myGroup
spring.kafka.consumer.auto-offset-reset=earliest

# JSON-Serialisierung fuer CustomMessage.
# Spring Boot 4 / Spring Kafka 4 nutzen Jackson 3: JacksonJsonSerializer ersetzt den alten JsonSerializer.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# ErrorHandlingDeserializer faengt kaputte Records ab (z. B. alte String-Nachrichten aus Teil 2),
# statt dass der Consumer in einer Endlosschlaufe haengen bleibt.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
